name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          # `rust` replaces the former separate `cargo` package on Arch
          pacman -S --noconfirm --needed base-devel pkgconf rust dbus

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="iio-niri-toggle-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${PKG}/plugin"
          cp target/release/iio-niri-toggle "dist/${PKG}/iio-niri-toggle"
          cp deploy/iio-niri-toggle.service "dist/${PKG}/iio-niri-toggle.service"
          cp deploy/install.sh "dist/${PKG}/install.sh"
          cp deploy/install-release.sh "dist/${PKG}/install-release.sh"
          cp deploy/uninstall.sh "dist/${PKG}/uninstall.sh"
          cp plugin/* "dist/${PKG}/plugin/"
          cp README.md README.zh-CN.md LICENSE "dist/${PKG}/"
          tar -C dist -czf "dist/${PKG}.tar.gz" "$PKG"
          rm -rf "dist/${PKG}"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
